name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip_docker_build:
        description: Skip the Docker image validation build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          GCS_BUCKET_NAME: test-bucket

  docker-build:
    name: Validate Docker build
    if: ${{ !inputs.skip_docker_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gcp-file-upload:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
